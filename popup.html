<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HuskySync</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="popup-wrap">
    <div class="row">
      <div class="brand"><img src="icons/icon48.png" alt=""><h1>HuskySync</h1></div>
      <span class="spacer"></span>
      <button id="sync" class="small">Sync now</button>
    </div>
    <div id="status" class="small muted"></div>
    <div id="notice"></div>
    <div id="list" class="popup-list"></div>
    <div class="row">
      <button id="dashboard" class="primary">Open dashboard</button>
      <span class="spacer"></span>
      <a href="#" id="settings" class="small">Settings</a>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
